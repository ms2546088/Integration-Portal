# Woodpecker CI Pipeline for Integration Portal
# Auto-triggered on push to main branch
# Workflow: Code → Validate → Build → Deploy

when:
  branch: main
  event: push

steps:
  - name: validate
    image: node:22-alpine
    commands:
      - echo "=== Validating Portal Files ==="
      - ls -la pages/*.html | wc -l
      - echo "Portal pages count OK"
      - for f in pages/*.html; do echo "Checking $f"; head -1 "$f"; done

  - name: deploy
    image: alpine:latest
    commands:
      - echo "=== Deploying to Portal ==="
      - echo "Target: /home/admin958168/_docker/_portainer/www/Developer-ms202603jpc/"
      - echo "Deploy timestamp: $(date -Iseconds)"
      - echo "Deployment would sync files to portal directory"
      - echo "✅ Pipeline complete"
