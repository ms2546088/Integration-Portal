<div class="section">
<h2>🌐 Network Management</h2>
<p style="color:var(--text2)">Manage Docker networks — create, inspect, and remove</p>
<button onclick="loadNetworks()" style="padding:6px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;margin-right:8px">🔄 Refresh</button>
</div>

<div class="section">
<h2>Docker Networks</h2>
<div style="overflow-x:auto">
<table class="tbl" id="networks-table">
<tr><th>Network</th><th>Driver</th><th>Scope</th><th>Actions</th></tr>
<tr><td colspan="4"><em>Loading...</em></td></tr>
</table>
</div>
<div id="net-result" style="margin-top:8px;font-size:13px"></div>
</div>

<div class="section">
<h2>Create Network</h2>
<div style="display:flex;gap:8px;align-items:end">
  <div style="flex:1"><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Name</label>
    <input type="text" id="new-net-name" placeholder="my-network" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px"></div>
  <div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Driver</label>
    <select id="new-net-driver" style="padding:8px;border:1px solid var(--border);border-radius:6px">
      <option value="bridge">bridge</option><option value="host">host</option><option value="overlay">overlay</option>
    </select></div>
  <button onclick="createNetwork()" style="padding:8px 20px;background:#2ea043;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600">➕ Create</button>
</div>
</div>
